<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#E24B4A">

<title>PokéColeção</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f5f5f5;
}

/* Tabs */
.tab-bar {
  display: flex;
  border-bottom: 1px solid #e0e0e0;
  background: white;
  position: sticky;
  top: 0;
}

.tab {
  flex: 1;
  padding: 12px;
  font-size: 11px;
  text-align: center;
  cursor: pointer;
  color: #888;
  border: none;
  background: none;
  border-bottom: 2px solid transparent;
}

.tab.active {
  color: #E24B4A;
  border-bottom: 2px solid #E24B4A;
}

/* Section */
.section { padding: 12px; }

/* Search */
.search-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.search-bar input {
  flex: 1;
  height: 38px;
  border-radius: 10px;
  border: 1px solid #ddd;
  padding: 0 12px;
}

/* FILTER CHIPS */
.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 10px;
}

.chip {
  padding: 6px 12px;
  border-radius: 20px;
  border: 1px solid #ddd;
  background: white;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}

.chip.active {
  background: #E24B4A;
  color: white;
  border-color: #E24B4A;
}

/* Sets grid */
.sets-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.set-card {
  background: white;
  border: 1px solid #eee;
  border-radius: 14px;
  padding: 10px;
  cursor: pointer;
}

.set-name {
  font-size: 11px;
  font-weight: 600;
}

/* Cards */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.card-item {
  border-radius: 8px;
  overflow: hidden;
  border: 2px solid transparent;
}

.card-item.owned {
  border-color: #1D9E75;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: #1D9E75;
  color: white;
  padding: 8px 18px;
  border-radius: 20px;
  opacity: 0;
}

.toast.show { opacity: 1; }

</style>
</head>

<body>

<div id="app">

  <!-- Tabs -->
  <div class="tab-bar">
    <button class="tab active" onclick="showTab('sets')">Sets</button>
    <button class="tab" onclick="showTab('collection')">Coleção</button>
    <button class="tab" onclick="showTab('binder')">Binder</button>
    <button class="tab" onclick="showTab('stats')">Stats</button>
  </div>

  <!-- SETS VIEW -->
  <div id="view-sets" class="section">

    <div class="search-bar">
      <input type="text" id="set-search" placeholder="Buscar..." oninput="filterSets()">
    </div>

    <!-- NEW FILTER CHIPS -->
    <div class="chips" id="chips"></div>

    <div class="sets-grid" id="sets-grid"></div>
  </div>

  <!-- CARDS -->
  <div id="view-cards" style="display:none">
    <div class="cards-grid" id="cards-grid"></div>
  </div>

  <div id="view-collection" style="display:none"></div>
  <div id="view-binder" style="display:none"></div>
  <div id="view-stats" style="display:none"></div>

</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://api.pokemontcg.io/v2';

let allSets = [];
let filteredSets = [];
let activeSeries = null;

let owned = JSON.parse(localStorage.getItem('pkm_owned') || '{}');

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

/* LOAD SETS */
async function loadSets() {
  const r = await fetch(`${API}/sets`);
  const d = await r.json();

  allSets = d.data;
  filteredSets = allSets;

  buildChips();
  renderSets();
}

/* BUILD CHIPS */
function buildChips() {
  const container = document.getElementById('chips');

  const seriesList = [...new Set(allSets.map(s => s.series))];

  container.innerHTML = `
    <div class="chip ${!activeSeries ? 'active' : ''}" onclick="selectSeries(null, this)">Todos</div>
    ${seriesList.map(s => `
      <div class="chip" onclick="selectSeries('${s}', this)">${s}</div>
    `).join('')}
  `;
}

/* SELECT CHIP */
function selectSeries(series, el) {
  activeSeries = series;

  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');

  filterSets();
}

/* FILTER */
function filterSets() {
  const q = document.getElementById('set-search').value.toLowerCase();

  filteredSets = allSets.filter(s => {
    const matchSearch = s.name.toLowerCase().includes(q);
    const matchSeries = !activeSeries || s.series === activeSeries;
    return matchSearch && matchSeries;
  });

  renderSets();
}

/* RENDER SETS */
function renderSets() {
  const g = document.getElementById('sets-grid');

  g.innerHTML = filteredSets.map(s => `
    <div class="set-card" onclick="openSet('${s.id}')">
      <div class="set-name">${s.name}</div>
    </div>
  `).join('');
}

/* OPEN SET */
async function openSet(setId) {
  document.getElementById('view-sets').style.display = 'none';
  document.getElementById('view-cards').style.display = 'block';

  const r = await fetch(`${API}/cards?q=set.id:${setId}`);
  const d = await r.json();

  renderCards(d.data);
}

/* RENDER CARDS */
function renderCards(cards) {
  const g = document.getElementById('cards-grid');

  g.innerHTML = cards.map(c => {
    const key = c.id;
    const isOwned = !!owned[key];

    return `
      <div class="card-item ${isOwned ? 'owned' : ''}"
           onclick="toggleOwned('${key}', this)">
        <img src="${c.images.small}">
      </div>
    `;
  }).join('');
}

/* TOGGLE */
function toggleOwned(key, el) {
  if (owned[key]) {
    delete owned[key];
    el.classList.remove('owned');
    showToast('Removido');
  } else {
    owned[key] = true;
    el.classList.add('owned');
    showToast('Adicionado');
  }

  localStorage.setItem('pkm_owned', JSON.stringify(owned));
}

/* TABS */
function showTab(tab) {
  ['sets','collection','binder','stats'].forEach(t => {
    document.getElementById('view-' + t).style.display = 'none';
  });

  document.getElementById('view-' + tab).style.display = 'block';
}

/* INIT */
loadSets();

</script>

</body>
</html>
