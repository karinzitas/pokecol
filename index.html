<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#E24B4A">

<title>PokéColeção</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f5f5f5;
}

/* Tabs */
.tab-bar {
  display: flex;
  border-bottom: 1px solid #e0e0e0;
  background: white;
  position: sticky;
  top: 0;
}

.tab {
  flex: 1;
  padding: 12px;
  font-size: 11px;
  text-align: center;
  cursor: pointer;
  color: #888;
  border: none;
  background: none;
  border-bottom: 2px solid transparent;
}

.tab.active {
  color: #E24B4A;
  border-bottom: 2px solid #E24B4A;
}

.section { padding: 12px; }

.search-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.search-bar input {
  flex: 1;
  height: 38px;
  border-radius: 10px;
  border: 1px solid #ddd;
  padding: 0 12px;
}

/* Chips */
.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  margin-bottom: 10px;
}

.chip {
  padding: 6px 12px;
  border-radius: 20px;
  border: 1px solid #ddd;
  background: white;
  font-size: 12px;
  cursor: pointer;
}

.chip.active {
  background: #E24B4A;
  color: white;
}

/* Sets */
.sets-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.set-card {
  background: white;
  border-radius: 14px;
  padding: 10px;
  cursor: pointer;
}

/* Cards */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.card-item {
  border-radius: 8px;
  overflow: hidden;
  border: 2px solid transparent;
}

.card-item.owned {
  border-color: #1D9E75;
}

/* Binder */
.binder-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding: 10px;
}

.binder-slot {
  aspect-ratio: 2/3;
  background: #ddd;
  border-radius: 8px;
  cursor: pointer;
}

/* Modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  flex-direction: column;
  padding: 12px;
}

.modal.open {
  display: flex;
}

.modal-content {
  background: white;
  border-radius: 12px;
  padding: 10px;
  overflow: auto;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: #1D9E75;
  color: white;
  padding: 8px 18px;
  border-radius: 20px;
  opacity: 0;
}

.toast.show { opacity: 1; }

</style>
</head>

<body>

<div id="app">

  <!-- Tabs -->
  <div class="tab-bar">
    <button class="tab active" onclick="showTab('sets')">Sets</button>
    <button class="tab" onclick="showTab('collection')">Coleção</button>
    <button class="tab" onclick="showTab('binder')">Binder</button>
    <button class="tab" onclick="showTab('stats')">Stats</button>
  </div>

  <!-- SETS -->
  <div id="view-sets" class="section">
    <div class="search-bar">
      <input type="text" id="set-search" placeholder="Buscar..." oninput="filterSets()">
    </div>
    <div class="sets-grid" id="sets-grid"></div>
  </div>

  <!-- CARDS -->
  <div id="view-cards" style="display:none">
    <div class="cards-grid" id="cards-grid"></div>
  </div>

  <!-- BINDER -->
  <div id="view-binder" style="display:none">
    <div class="binder-grid" id="binder-grid"></div>
  </div>

  <!-- MODAL PICKER -->
  <div class="modal" id="picker">
    <div class="modal-content">

      <!-- BASE FILTER -->
      <div class="chips" id="base-filters">
        <div class="chip active" onclick="setBaseFilter('all', this)">Todos</div>
        <div class="chip" onclick="setBaseFilter('owned', this)">Minha coleção</div>
      </div>

      <!-- SERIES FILTER -->
      <div class="chips" id="series-chips"></div>

      <div class="cards-grid" id="picker-grid"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://api.pokemontcg.io/v2';

let allSets = [];
let owned = JSON.parse(localStorage.getItem('pkm_owned') || '{}');
let binder = Array(9).fill(null);

let activeBase = 'all';
let activeSeries = null;
let allCardsCache = [];

/* TOAST */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

/* LOAD SETS */
async function loadSets() {
  const r = await fetch(`${API}/sets`);
  const d = await r.json();
  allSets = d.data;
  renderSets();
  buildSeriesChips();
}

/* SETS */
function filterSets() {
  const q = document.getElementById('set-search').value.toLowerCase();
  const filtered = allSets.filter(s => s.name.toLowerCase().includes(q));

  document.getElementById('sets-grid').innerHTML = filtered.map(s =>
    `<div class="set-card" onclick="openSet('${s.id}')">${s.name}</div>`
  ).join('');
}

function renderSets() {
  filterSets();
}

/* OPEN SET */
async function openSet(id) {
  document.getElementById('view-sets').style.display = 'none';
  document.getElementById('view-cards').style.display = 'block';

  const r = await fetch(`${API}/cards?q=set.id:${id}`);
  const d = await r.json();

  renderCards(d.data);
}

function renderCards(cards) {
  document.getElementById('cards-grid').innerHTML = cards.map(c => `
    <div class="card-item ${owned[c.id] ? 'owned':''}"
      onclick="toggleOwned('${c.id}', this)">
      <img src="${c.images.small}">
    </div>
  `).join('');
}

/* OWNED */
function toggleOwned(id, el) {
  if (owned[id]) {
    delete owned[id];
    el.classList.remove('owned');
  } else {
    owned[id] = true;
    el.classList.add('owned');
  }
  localStorage.setItem('pkm_owned', JSON.stringify(owned));
}

/* BINDER */
function renderBinder() {
  const g = document.getElementById('binder-grid');
  g.innerHTML = binder.map((c,i)=>`
    <div class="binder-slot" onclick="openPicker(${i})">
      ${c ? `<img src="${c}" style="width:100%">` : ''}
    </div>
  `).join('');
}

/* OPEN PICKER */
async function openPicker(index) {
  document.getElementById('picker').classList.add('open');

  if (!allCardsCache.length) {
    const r = await fetch(`${API}/cards?pageSize=250`);
    const d = await r.json();
    allCardsCache = d.data;
  }

  renderPicker();
  window.currentSlot = index;
}

/* FILTERS */
function setBaseFilter(type, el) {
  activeBase = type;
  document.querySelectorAll('#base-filters .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderPicker();
}

function selectSeries(series, el) {
  activeSeries = series;
  document.querySelectorAll('#series-chips .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderPicker();
}

function buildSeriesChips() {
  const series = [...new Set(allSets.map(s=>s.series))];
  document.getElementById('series-chips').innerHTML = `
    <div class="chip active" onclick="selectSeries(null, this)">Todas</div>
    ${series.map(s=>`<div class="chip" onclick="selectSeries('${s}', this)">${s}</div>`).join('')}
  `;
}

/* PICKER */
function renderPicker() {
  let cards = allCardsCache;

  if (activeBase === 'owned') {
    cards = cards.filter(c => owned[c.id]);
  }

  if (activeSeries) {
    cards = cards.filter(c => c.set.series === activeSeries);
  }

  document.getElementById('picker-grid').innerHTML = cards.slice(0,100).map(c=>`
    <div class="card-item" onclick="selectCard('${c.images.small}')">
      <img src="${c.images.small}">
    </div>
  `).join('');
}

function selectCard(img) {
  binder[window.currentSlot] = img;
  renderBinder();
  document.getElementById('picker').classList.remove('open');
}

/* TABS */
function showTab(tab) {
  ['sets','collection','binder','stats'].forEach(t=>{
    const el = document.getElementById('view-'+t);
    if (el) el.style.display = 'none';
  });

  document.getElementById('view-'+tab).style.display = 'block';

  if (tab === 'binder') renderBinder();
}

/* INIT */
loadSets();

</script>

</body>
</html>
